# Serves the webpack-built demo from tester-app/dist at:
#   https://sqlite-wasm-viewer.mysticeggs.xyz/
#
# scripts/deploy-demo.sh copies this file to /etc/nginx/sites-available/sqlite-wasm-viewer-demo.conf.
# root must match DEPLOY_WEBROOT.
#
# Do not add a types{} block in these locations. It replaces the inherited
# MIME map, so a wasm-only map serves .js as application/octet-stream and
# workers refuse to import those chunks. mime.types already includes wasm.

server {
    listen 443 ssl http2;
    server_name sqlite-wasm-viewer.mysticeggs.xyz;

    root /var/www/sqlite-wasm-viewer-demo;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sqlite-wasm-viewer.mysticeggs.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sqlite-wasm-viewer.mysticeggs.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location = /demo {
        return 301 https://$host/;
    }

    location /demo/ {
        return 301 https://$host/;
    }

    location = /index.html {
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
