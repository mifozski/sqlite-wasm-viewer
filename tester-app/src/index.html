<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer App</title>
    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #sample_db_progress_wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 8px;
            font-size: 14px;
        }

        #sample_db_progress {
            width: 140px;
            height: 14px;
        }
    </style>
</head>

<body>
    <input type="file" id="file_input" style="display: none;" />
    <button id="import_db_btn">Import db</button>
    <button id="load_sample_db_btn">Load sample db</button>
    <span id="sample_db_progress_wrap" hidden>
        <progress id="sample_db_progress" max="100"></progress>
        <span id="sample_db_status"></span>
    </span>
    <button id="show_viewer_btn">Show Viewer</button>
</body>

</html>
